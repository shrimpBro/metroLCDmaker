<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LCD报站屏制作器 - 全能版</title>
<style>
* {
  margin:0; padding:0; box-sizing:border-box;
  font-family: "Courier New", monospace;
}
body {
  background:#eee; padding:20px;
}

.container {
  max-width:1500px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.editor {
  background:#fff;
  padding:20px;
  border-radius:8px;
  display:grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap:12px;
}
.editor label { font-size:14px; margin-bottom:4px; display:block; }
.editor input, .editor select {
  width:100%;
  padding:8px;
  font-size:14px;
  border:1px solid #ccc;
  border-radius:4px;
}
.editor button {
  padding:10px;
  background:#E000FF;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-weight:bold;
}
.editor h3 {
  grid-column: 1/-1;
  margin-bottom:8px;
  font-size:18px;
}

.lcd-screen {
  width:1440px;
  height:240px;
  background:#fff;
  color:#E000FF;
  border:10px solid #888;
  border-radius:6px;
  padding:12px 20px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.lcd-screen::before {
  content:''; position:absolute; inset:0;
  background-image: 
    linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,0.03) 1px, transparent 1px);
  background-size:2px 2px;
  pointer-events:none;
}
.lcd-top {
  text-align:center;
  font-size:24px;
  font-weight:bold;
  padding-bottom:6px;
  border-bottom:1px solid #000;
}
.stations-wrap {
  flex:1;
  overflow:hidden;
  position:relative;
}
.stations {
  display:flex;
  gap:40px;
  height:100%;
  align-items:center;
  position:absolute;
  transition: transform 0.6s ease;
}
.station {
  min-width:220px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  font-size:24px;
  line-height:1.3;
  transition: all 0.3s;
}
.station span {
  font-size:20px;
  margin-top:4px;
}
.past { opacity:0.4; }
.current {
  background:#E000FF;
  color:#000;
  border-radius:6px;
  padding:8px 12px;
}
.next {
  color:#cc0000;
  text-decoration:underline;
  animation:blink 1.1s infinite alternate;
}
@keyframes blink { 0%{opacity:1;}100%{opacity:0.5;} }
.lcd-bottom {
  text-align:center;
  font-size:20px;
  padding-top:6px;
  border-top:1px solid #000;
}

.controls {
  display:flex; gap:10px;
}
.controls button {
  padding:10px 16px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
  <div class="editor">
    <h3>📝 线路基础设置</h3>
    <div>
      <label>线路名称</label>
      <input type="text" id="lineName" value="基隆地鐵環狀線">
    </div>
    <div>
      <label>顺行/终点方向</label>
      <input type="text" id="dirCN" value="往南海寺（順時針）">
    </div>
    <div>
      <label>逆行/起点方向</label>
      <input type="text" id="revCN" value="往南海寺（逆時針）">
    </div>
    <div>
      <label>线路类型</label>
      <select id="lineType">
        <option value="loop">🚇 环线（循环）</option>
        <option value="linear">🛤️ 普通直线（单程）</option>
      </select>
    </div>
    <div>
      <label>主题颜色</label>
      <input type="text" id="mainColor" value="#E000FF">
    </div>
    <div>
      <label></label>
      <button onclick="saveLineSettings()">💾 保存线路设置</button>
    </div>

    <h3>🚏 当前站信息（自动同步）</h3>
    <div>
      <label>当前站名</label>
      <input type="text" id="curName">
    </div>
    <div>
      <label>英文</label>
      <input type="text" id="curEn">
    </div>
    <div>
      <label>开门方向</label>
      <select id="curDoor">
        <option value="right">右侧开门</option>
        <option value="left">左侧开门</option>
        <option value="both">两侧开门</option>
      </select>
    </div>
    <div>
      <label>换乘(中文)</label>
      <input type="text" id="curTransfer">
    </div>
    <div>
      <label>换乘(英文)</label>
      <input type="text" id="curTransferEN">
    </div>
    <div>
      <label></label>
      <button onclick="applyCurrentStation()">✅ 应用修改</button>
    </div>
  </div>

  <div class="lcd-screen">
    <div class="lcd-top" id="lineInfo">基隆地鐵環狀線 往南海寺（順時針）</div>
    <div class="stations-wrap">
      <div class="stations" id="stations"></div>
    </div>
    <div class="lcd-bottom" id="door">右侧开门 | Doors will open on the right</div>
  </div>

  <div class="controls">
    <button onclick="prev()">← 上一站</button>
    <button onclick="next()">下一站 →</button>
    <button onclick="toggleDir()">切换方向</button>
  </div>
</div>

<script>
// 原始数据
const originalLine = {
  nameCN: "基隆地鐵環狀線",
  dirCN: "往南海寺（順時針）",
  revCN: "往南海寺（逆時針）",
  color: "#E000FF",
  type: "loop",
  stations: [
    { name:"南海寺", en:"Nanhaisi", door:"right" },
    { name:"信義", en:"Xinyi", door:"right" },
    { name:"求神", en:"Qiushen", door:"right" },
    { name:"基隆站", en:"Jilong Railway Station", door:"right", transfer:"基隆湖線，城際線，機場線", transferEN:"Jilong Lake Line, Intercity Line, Airport Line" },
    { name:"信義南", en:"Xinyi South", door:"right" },
    { name:"牛車水西", en:"Niucheshui West", door:"right", transfer:"紅線", transferEN:"Red Line" },
    { name:"宜山路", en:"Yishan Road", door:"right" },
    { name:"寧夏北", en:"Ningxia North", door:"right", transfer:"南基隆快線", transferEN:"South Jilong Express" },
    { name:"民族路", en:"Minzu Road", door:"right", transfer:"基隆湖線", transferEN:"Jilong Lake Line" },
    { name:"幸福南", en:"Xingfu South", door:"right" },
    { name:"幸福東", en:"Xingfu East", door:"right", transfer:"南基隆快線", transferEN:"South Jilong Express" },
    { name:"基隆CBD", en:"Jilong CBD", door:"right" },
    { name:"虎頭山西門", en:"Hutou Hill West Gate", door:"right" },
    { name:"小西街", en:"Xiaoxi Street", door:"right"},
    { name:"西貢商城", en:"Saigon Mall", door:"right", transfer:"紅線", transferEN:"Red Line" },
    { name:"善禹", en:"Shanyu", door:"right" },
    { name:"隆興", en:"Longxing", door:"right" },
    { name:"虎牙", en:"Huya", door:"right" },
    { name:"JZMC", en:"Jason&Zhaoguo Meeting Center", door:"right" },
    { name:"南海寺", en:"Nanhaisi", door:"right" }
  ]
};

let line = JSON.parse(JSON.stringify(originalLine));
let idx = 3;
let forward = true;

// 同步当前站到表单
function syncCurrentStationToForm() {
  const cur = line.stations[idx];
  document.getElementById('curName').value = cur.name || '';
  document.getElementById('curEn').value = cur.en || '';
  document.getElementById('curDoor').value = cur.door || 'right';
  document.getElementById('curTransfer').value = cur.transfer || '';
  document.getElementById('curTransferEN').value = cur.transferEN || '';
}

// 渲染
function render() {
  const s = line.stations;
  const dirCN = forward ? line.dirCN : line.revCN;
  document.getElementById("lineInfo").innerText = `${line.nameCN} ${dirCN}`;

  document.getElementById("stations").innerHTML = s.map((st, i) => `
    <div class="station ${i<idx?'past':i==idx?'current':i==idx+1?'next':''}">
      ${st.name}<span>${st.en}</span>
    </div>
  `).join('');

  const wrap = document.querySelector('.stations-wrap');
  const stationsEl = document.querySelector('.stations');
  const current = document.querySelectorAll('.station')[idx];
  if (current) {
    const centerPos = (wrap.clientWidth - current.offsetWidth) / 2;
    stationsEl.style.transform = `translateX(${centerPos - current.offsetLeft}px)`;
  }

  const cur = s[idx];
  const door = cur.door||'right';
  const doorCN = door==='right' ? '右侧开门' : door==='left' ? '左侧开门' : '两侧开门';
  const doorEN = door==='right' ? 'Doors will open on the right' : door==='left' ? 'Doors will open on the left' : 'Doors will open on both sides';
  const trCN = cur.transfer ? `可换乘：${cur.transfer}` : '';
  const trEN = cur.transferEN ? `Transfer: ${cur.transferEN}` : '';
  
  let txt = `${doorCN} | ${doorEN}`;
  if (trCN) txt += ` | ${trCN} | ${trEN}`;
  document.getElementById("door").innerText = txt;
}

// ==========================================
// 1. 保存线路设置（只改线路信息，不改站）
// ==========================================
function saveLineSettings() {
  line.nameCN = document.getElementById('lineName').value;
  line.dirCN = document.getElementById('dirCN').value;
  line.revCN = document.getElementById('revCN').value;
  line.type = document.getElementById('lineType').value;
  line.color = document.getElementById('mainColor').value;
  
  document.querySelector('.lcd-screen').style.color = line.color;
  render();
}

// ==========================================
// 2. 应用修改（只改当前站，不改线路）
// ==========================================
function applyCurrentStation() {
  const cur = line.stations[idx];
  cur.name = document.getElementById('curName').value;
  cur.en = document.getElementById('curEn').value;
  cur.door = document.getElementById('curDoor').value;
  cur.transfer = document.getElementById('curTransfer').value;
  cur.transferEN = document.getElementById('curTransferEN').value;
  render();
}

// 线路控制
function next() {
  if(line.type === 'loop') { idx++; if (idx >= line.stations.length) idx = 0;
  } else { if(idx < line.stations.length -1) idx++; }
  syncCurrentStationToForm(); render();
}
function prev() {
  if(line.type === 'loop') { idx--; if (idx < 0) idx = line.stations.length -1;
  } else { if(idx > 0) idx--; }
  syncCurrentStationToForm(); render();
}
function toggleDir() {
  forward = !forward; render();
}

// 初始化
window.onload = function(){
  syncCurrentStationToForm();
  render();
}
</script>
</body>
</html>
